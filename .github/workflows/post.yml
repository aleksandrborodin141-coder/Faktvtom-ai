name: Post to Telegram

on:
  # Запуск по расписанию: каждый день в 9:00 UTC (12:00 по МСК)
  schedule:
    - cron: '0 9 * * *'
  
  # И ручной запуск через кнопку "Run workflow"
  workflow_dispatch:
jobs:
  post:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-telegram-bot openai
      - run: python poster.py


